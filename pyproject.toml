[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benford-weighted-digit-sums"
version = "1.0.0"
description = "Reproducibility package for Benford-weighted digit sums and second-order asymptotics"
requires-python = ">=3.10"
authors = [{name = "Radhe Dhoundiyal"}]
license = {text = "MIT"}
dependencies = [
  "mpmath==1.4.1",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "matplotlib==3.11.1",
]

[project.optional-dependencies]
verification = ["pytest==9.1.1", "pypdf==6.17.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
